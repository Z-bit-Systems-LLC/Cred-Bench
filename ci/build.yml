# Runs on Linux. EnableWindowsTargeting lets the SDK compile the net10.0-windows WPF projects there,
# so a broken UI build still fails this job; the UI tests run them on Windows.
steps:
  - task: UseDotNet@2
    displayName: 'Install .NET SDK'
    inputs:
      packageType: 'sdk'
      version: '10.x'

  - task: DotNetCoreCLI@2
    displayName: 'dotnet build'
    inputs:
      command: 'build'
      projects: '$(solution)'
      arguments: '--configuration $(buildConfiguration) -p:EnableWindowsTargeting=true'

  - task: DotNetCoreCLI@2
    displayName: 'dotnet test'
    inputs:
      command: 'test'
      nobuild: true
      projects: 'test/Core.Tests/Core.Tests.csproj'
      arguments: '--configuration $(buildConfiguration) --collect:"XPlat Code Coverage"'

  - task: reportgenerator@5
    displayName: 'Generate Code Coverage Report'
    inputs:
      reports: '$(Agent.TempDirectory)/**/coverage.cobertura.xml'
      targetdir: '$(Build.SourcesDirectory)/coveragereport'
      reporttypes: 'Cobertura;HtmlInline_AzurePipelines'

  - task: PublishCodeCoverageResults@2
    displayName: 'Publish Code Coverage Results'
    inputs:
      codeCoverageTool: 'Cobertura'
      summaryFileLocation: '$(Build.SourcesDirectory)/coveragereport/Cobertura.xml'
      reportDirectory: '$(Build.SourcesDirectory)/coveragereport'
      failIfCoverageEmpty: true
